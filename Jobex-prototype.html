const menus={worker:[['discover','cards','Discover'],['matches','chat','Connections'],['shifts','calendar','My shifts'],['payday','chart','Payday Lab'],['profile','user','My profile'],['larp','spark','LARP']],employer:[['overview','briefcase','Overview'],['studio','spark','AI shift studio'],['candidates','user','Candidates'],['analytics','chart','Insights']]};function setRole(r){state.role=r;state.page=r==='worker'?'discover':'overview';render()}function go(p){state.page=p;render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}function render(){initLarp();persist();const items=menus[state.role];const nav=items.map(([p,i,t])=>`<button class="${state.page===p?'active':''}" aria-current="${state.page===p?'page':'false'}" onclick="go('${p}')" title="${t}" aria-label="${t}">${icon(i)}<span class="nav-label">${t}</span>${p==='matches'&&state.applications.length?`<span class="nav-count">${state.applications.length}</span>`:''}</button>`).join('');document.getElementById('nav').innerHTML=nav;document.getElementById('mobileNav').innerHTML=items.map(([p,i,t])=>`<button class="${state.page===p?'active':''}" aria-current="${state.page===p?'page':'false'}" onclick="go('${p}')">${icon(i)}${t}</button>`).join('');document.getElementById('crumb').textContent=items.find(x=>x[0]===state.page)?.[2]||'Discover';document.getElementById('workerRole').classList.toggle('active',state.role==='worker');document.getElementById('employerRole').classList.toggle('active',state.role==='employer');document.getElementById('identityName').textContent=state.role==='worker'?state.profile.name:'MOKO Coffee';document.getElementById('identityAvatar').textContent=state.role==='worker'?'AK':'MC';document.getElementById('identitySub').textContent=state.role==='worker'?activeTitle():'Employer workspace';main.innerHTML=`<div class="fade">${({discover,matches,shifts,profile,overview,studio,candidates,analytics,larp,p function heading(ey,title,sub,action=''){return `<div class="heading"><div><span class="eyebrow">${ey}</span><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function empty(title,body,action=''){return `<div class="empty"><div class="empty-symbol">${icon('spark')}</div><h2>${title}</h2><p>${body}</p>${action}</div>`}function currentJobs(){const query=(state.search||'').trim().toLowerCase();return state.jobs.filter(j=>(!query||[j.title,j.company,j.area,j.description].join(' ').toLowerCase().includes(query))&&unlocked(j)&&!state.skipped.includes(j.id)&&!application(j.id)&&fit(j).eligible&&(state.filter==='All shifts'||state.filter===j.category||state.filter==='Saved'&&state.saved.includes(j.id))).sort((a,b)=>state.sort==='pay'?b.rate-a.rate:state.sort==='commute'?a.commute-b.commute:fit(b).score-fit(a).score)}
function discoverBase(){const list=currentJobs(),j=list[0];return heading('FLEXIBLE WORK. REAL POSSIBILITIES.','Your next shift starts here.','A little extra income. A new experience. A shift that fits you.',`<button class="button light" onclick="go('profile')">${icon('sliders')} My preferences</button>`)+`${delusionControl('discover')}${searchControls()}<div class="discovery"><section class="feed"><div class="filterbar">${['All shifts','Hospitality','Events','Retail','Saved'].map(f=>`<button class="chip ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f==='Saved'?icon('bookmark'):''}${f}</button>`).join('')}</div>${j?`<div class="job-wrap"><article class="job-card" id="swipeCard" data-job="${j.id}">${card(j)}</article></div><div class="swipe-actions"><div><button class="round skip" aria-label="Pass on this shift" onclick="skip(${j.id})">${icon('close')}</button><div class="action-label">PASS</div></div><div><button class="round like" aria-label="I'm interested in this shift" onclick="apply(${j.id})">${icon('heart')}</button><div class="action-label">I'M INTERESTED</div></div><div><button class="round" aria-label="View shift details" onclick="details(${j.id})">${icon('briefcase')}</button><div class="action-label">DETAILS</div></div></div><p class="swipe-hint">${state.skipped.length?`<button class="text-button" onclick="undoPass()">↶ Undo last pass</button><br>`:''}Swipe or tap to choose · ${list.length} suitable ${list.length===1?'shift':'shifts'} to explore</p>`:empty('No matching shifts right now.',!state.profile.available?'Your availability is paused. Turn it on or update your preferences.':state.search?'Try a broader search or clear your search and filters.':state.filter==='Saved'?'Save a shift using the bookmark to find it here.':'Check your preferences or restore passed shifts.',`<button class="button" onclick="go('profile')">Edit preferences</button> <button class="button light" onclick="state.search='';state.filter='All shifts';stat function card(j){const f=fit(j);return `<div class="scene">${scene(j.scene)}<div class="scene-top"><span class="badge ${j.urgent?'lime':'white'}">${j.urgent?'↗ Hiring now':'A little change of scene'}</span><button class="save-btn" aria-label="${state.saved.includes(j.id)?'Unsave':'Save'} shift" onclick="saveJob(${j.id})" style="color:${state.saved.includes(j.id)?'var(--purple)':'var(--ink)'}">${icon('bookmark')}</button></div><span class="scene-caption">${esc(j.company.toUpperCase())} / WARSAW</span></div><div class="card-content"><div class="company">${esc(j.company)} ${icon('shield')} Demo verified</div><div class="job-title"><div><h2>${esc(discoverTitle(j))}</h2><span class="duration">${esc(j.category)} · One shift</span></div><div class="rate">${j.rate} zł<small>gross / hour</small></div></div><p class="panel-note" style="margin:12px 0">${esc(loreCaption(j))}</p>${state.larp.delusion>=34?`<small style="display:block;color:var(--muted)">Actual role: ${esc(j.title)}</small>`:''}<div class="meta"><span>${icon('pin')}${esc(j.area)}</span><span>${icon('clock')}${j.commute} min commute*</span></div><div class="job-info"><div><span class="mini-label">YOUR SHIFT</span><b>${day(j.date)} · ${j.start}–${j.end}</b></div><div><span class="mini-label">ESTIMATED GROSS PAY</span><b>${earnings(j)} zł <span style="font-weight:400;color:var(--muted)">/ ${hours(j)} hours</span></b></div></div><div class="taglist">${j.requirements.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}<span class="tag">No CV needed</span></div>${goalWindow(j)}<div class="ai-reason">${icon('spark')}<span><b>${f.score}% demo match.</b> ${f.skills.length?`${f.skills.length} relevant skills`:'A chance to build new skills'} · ${f.available?'fits your hours':'check availability'} · ${f.travel?'within your commute':'longer commute'}.</span></div></div>`}
function saveJob(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render()}function skip(id){if(!state.skipped.includes(id))state.skipped.push(id);render();toast('Shift passed. Use Undo last pass to bring it back.')}function undoPass(){if(!state.skipped.length)return;state.skipped.pop();render();toast('Last passed shift restored')}function apply(id){if(application(id))return;if(!unlocked(job(id)))return toast('Earn more LARP points to unlock this shift.');if(!fit(job(id)).eligible)return toast('This shift no longer fits your availability.');state.applications.push({jobId:id,status:'applied',appliedAt:Date.now(),messages:[],workerRating:0,employerRating:0});render();toast('Interest sent! Switch to “I’m hiring” to accept as the employer.')}

function matches(){return heading('YOUR NEXT CONVERSATION','Good things start with a hello.','Track your interest, meet the team, and agree the details.')+`<div class="match-grid">${state.applications.length?state.applications.map(a=>matchCard(a)).join(''):empty('Make the first move.','Tap the heart on a shift you like to start a connection.',`<button class="button" onclick="go('discover')">Discover shifts ${icon('arrow')}</button>`)}</div>`}const statusText={applied:'Interest sent',matched:'It’s a match',contract:'Contract ready',signed:'Shift confirmed',completed:'Shift completed'};function matchCard(a){let j=job(a.jobId);return `<article class="panel match-card"><span class="badge ${a.status==='applied'?'orange':'green'}">${statusText[a.status]}</span><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${day(j.date)}<br>${j.start}–${j.end} · ${earnings(j)} zł gross</p><div class="progress"><span style="width:${({applied:20,matched:40,contract:60,signed:80,completed:100})[a.status]}%"></span></div><span class="duration">${a.status==='applied'?'Waiting for the employer to review your profile.':a.status==='matched'?'You can now chat and review the shift details.':a.status==='contract'?'Review the demo agreement before signing.':a.status==='signed'?'Both parties have signed the demo agreement.':'Thanks for showing up. Leave mutual feedback.'}</span><div>${a.status==='applied'?`<button class="button light" onclick="setRole('employer');go('candidates')">Review as employer ${icon('arrow')}</button>`:`<button class="button" onclick="chat(${j.id})">Open conversation ${icon('chat')}</button>`}</div></article>`}
function shifts(){const a=state.applications.filter(a=>['signed','completed'].includes(a.status));return heading('A LITTLE PLAN FOR WHAT’S NEXT','Your shifts, sorted.','Confirmed work and your completed shifts in one place.')+`<div class="match-grid">${a.length?a.map(matchCard).join(''):empty('Your schedule is open.','After both sides sign a demo agreement, your shift will appear here.',`<button class="button" onclick="go('matches')">View connections</button>`)}</div>`}
function profile(){if(state.larp.profileView==='achievements')return achievements();const p=state.profile;return profileTabs()+heading('MORE THAN A CV','A few details. Better matches.','Your preferences directly change which shifts appear in Discover.')+`<div class="profile-grid"><form class="panel" onsubmit="saveProfile(event)"><div class="panel-head"><h3>Your worker profile</h3><span class="badge green">Demo verified</span></div><label class="input-label" for="pname">Name</label><input id="pname" name="name" required maxlength="60" value="${esc(p.name)}"><div class="field-grid"><div><label class="input-label" for="minrate">Minimum gross rate (zł/hour)</label><input id="minrate" name="minRate" type="number" min="1" max="500" value="${p.minRate}" required></div><div><label class="input-label" for="commute">Maximum commute (minutes)</label><input id="commute" name="maxCommute" type="number" min="5" max="120" value="${p.maxCommute}" required></div></div><label class="input-label">Available days</label>${[dayOffset(0),dayOffset(1),dayOffset(2)].map(d=>`<label class="check-row"><input name="days" type="checkbox" value="${d}" ${p.days.includes(d)?'checked':''}>${day(d)}</label>`).join('')}<div class="field-grid"><div><label class="input-label" for="pstart">From</label><input id="pstart" name="start" type="time" value="${p.start}" required></div><div><label class="input-label" for="pend">Until</label><input id="pend" name="end" type="time" value="${p.end}" required></div></div><label class="input-label">Your skills</label><div class="field-grid">${['Coffee making','Customer service','Teamwork','Event setup','Stock handling'].map(s=>`<label class="check-row"><input name="skills" type="checkbox" value="${s}" ${p.skills.includes(s)?'checked':''}>${s}</label>`).join('')}</div><button class="button full" style="margin-top:20px">Save preferences ${icon('check')}</button></form><div><div class="panel"><span class="eyebrow">WHY THIS MATTERS</span><h2>A useful match has a reason.</h2><p class="panel-note">The demo ranks skill overlap, available hours, commute, and preferred pay. Confirmed shifts are checked for schedule conflicts.</p><div class="fit-row" style="margin-top:25px"><div class="fit-icon">${icon('shield')}</div><div><b>Skills and identity checks</b><p>Badges are examples only. No identity documents have been collected or verified.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('user')}</div><div><b>You stay in control</b><p>You choose the opportunities and review the terms before committing.</p></div></div></div><div class="panel availability"><h3>Your matching inputs</h3><p class="panel-note">${p.skills.length} skills · ${p.days.length} available days<br>At least ${p.minRate} zł gross/hour · Up to ${p.maxCommute} minutes away</p></div></div></div>`}
function saveProfile(ev){ev.preventDefault();const f=new FormData(ev.target);if(!f.get('name').trim())return toast('Enter a name before saving.');if(minutes(f.get('end'))<=minutes(f.get('start')))return toast('Choose an end time after your start time.');state.profile={...state.profile,name:f.get('name').trim(),minRate:+f.get('minRate'),maxCommute:+f.get('maxCommute'),start:f.get('start'),end:f.get('end'),days:f.getAll('days'),skills:f.getAll('skills')};render();toast('Preferences saved. Your shift matches have been updated.')}
function metrics(){const a=state.applications,signed=a.filter(x=>['signed','completed'].includes(x.status)),matched=a.filter(x=>x.status!=='applied'),completed=a.filter(x=>x.status==='completed');return {a,signed,matched,completed,fill:signed.length?Math.round(signed.reduce((t,x)=>t+(x.signedAt-x.appliedAt)/60000,0)/signed.length):null,conversion:a.length?Math.round(matched.length/a.length*100):null,completion:signed.length?Math.round(completed.length/signed.length*100):null}}function statCards(){const m=metrics();return `<div class="stat-grid"><div class="stat"><span class="mini-label">AVG. TIME TO FILL</span><div class="value">${m.fill===null?'—':m.fill<1?'<1 min':m.fill+' min'}</div><em>Target: under 2 hours</em></div><div class="stat"><span class="mini-label">INTEREST → MATCH</span><div class="value">${m.conversion===null?'—':m.conversion+'%'}</div><small>${m.matched.length} matched / ${m.a.length} interested</small></div><div class="stat"><span class="mini-label">SHIFT COMPLETION</span><div class="value">${m.completion===null?'—':m.completion+'%'}</div><small>${m.completed.length} completed / ${m.signed.length} signed</small></div><div class="stat"><span class="mini-label">ACTIVE SHIFT CARDS</span><div class="value">${state.jobs.length}</div><small>Across your demo workspace</small></div></div>`}
function overview(){return heading('THE RIGHT HELP, RIGHT WHEN YOU NEED IT','A full team. A lighter day.','Create a shift, find the fit, and get the details agreed.',`<button class="button" onclick="go('studio')">${icon('plus')} Create a shift</button>`)+statCards()+`<div class="employer-grid"><div class="panel"><div class="panel-head"><h3>Your shift board</h3><span class="badge">${state.jobs.length} shifts</span></div>${state.jobs.map(j=>{const a=application(j.id);return `<div class="request-row"><div><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${day(j.date)} · ${j.start}–${j.end}<br>${j.rate} zł gross/hour · ${esc(j.area)}</p></div><div class="row-actions">${a?`<span class="badge ${a.status==='applied'?'orange':'green'}">${statusText[a.status]}</span>`:'<span class="badge">Open</span>'}<button class="button light small" onclick="${a&&a.status!=='applied'?`chat(${j.id})`:`go('candidates')`}">${a&&a.status!=='applied'?'Open chat':'Candidates'} ${icon('arrow')}</button></div></div>`}).join('')}</div><div><div class="panel tip-panel"><span class="eyebrow">MEET YOUR SHIFT ASSISTANT</span><h3>One sentence.<br>A shift ready to share.</h3><p>Describe the help you need. Review a structured card with the essential details.</p><button class="button lime" onclick="go('studio')">Try the AI studio ${icon('spark')}</button></div><div class="panel"><h3>Try the complete journey</h3><div class="fit-row"><div class="fit-icon">1</div><div><b>Swipe as a worker</b><p>Express interest in a suitable shift.</p></div></div><div class="fit-row"><div class="fit-icon">2</div><div><b>Match as an employer</b><p>Accept the worker and send a draft.</p></div></div><div class="fit-row"><div class="fit-icon">3</div><div><b>Confirm, complete, review</b><p>Try both roles in the conversation.</p></div></div></div></div></div>`}
const examples={cafe:'Need a barista at MOKO Coffee in Mokotów on Friday, 08:00–16:00, 35 zł/hour. Coffee making and customer service experience.',event:'Need event crew at Studio Praga on Saturday, 15:00–23:00, 38 zł/hour. Teamwork and event setup.',retail:'Need a retail assistant at Form & Field in Śródmieście on Friday, 10:00–18:00, 33 zł/hour. Customer service and stock handling.'};
function studio(){return heading('FROM A QUICK THOUGHT TO A CLEAR OPPORTUNITY','Meet your shift assistant.','Describe the help you need. Review the details before publishing.')+`<div class="studio"><div><form class="panel" onsubmit="generateDraft(event)"><div class="panel-head"><h3>What does your team need?</h3><span class="badge">✦ AI demo</span></div><label class="input-label" for="brief">Your staffing request</label><textarea id="brief" name="brief" placeholder="E.g. Need a barista in Mokotów on Friday, 08:00–16:00, 35 zł/hour…" required minlength="15" maxlength="1500">${esc(state.draft?.brief||examples.cafe)}</textarea><div class="example-chips"><span class="panel-note" style="margin:4px 0">Try an example:</span>${Object.keys(examples).map(k=>`<button type="button" onclick="document.getElementById('brief').value=examples['${k}']">${{cafe:'☕ Café',event:'✦ Event',retail:'↗ Retail'}[k]}</button>`).join('')}</div><button class="button full" id="generateButton">${icon('spark')} Generate shift card</button><p class="panel-note">This prototype uses local text parsing and example templates. No external AI service is connected.</p></form><div class="panel"><h3>What the assistant looks for</h3><div class="fit-row"><div class="fit-icon">${icon('briefcase')}</div><div><b>Role and essential skills</b><p>A clear title and a concise list of requirements.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('clock')}</div><div><b>When, where, and how much</b><p>Shift hours, area and gross hourly rate.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('user')}</div><div><b>Who could fit</b><p>Rank workers against the reviewed shift details.</p></div></div></div></div><section id="draftArea">${draftForm()}</section></div>`}
function draftForm(){const d=state.draft;if(!d)return `<div class="draft-box empty"><div class="empty-symbol">${icon('cards')}</div><h2>Your next shift, taking shape.</h2><p>Generate a card to see the extracted details here. You can edit everything before it goes live.</p></div>`;return `<form class="panel" onsubmit="publishDraft(event)"><div class="panel-head"><h3>Review your shift card</h3><span class="badge green">Draft ready</span></div>${d.missing.length?`<div class="warning">Please supply or confirm: ${esc(d.missing.join(', '))}. These details could not be read confidently.</div>`:''}<label class="input-label" for="dtitle">Role</label><input id="dtitle" name="title" value="${esc(d.title)}" required maxlength="80"><label class="input-label" for="dcompany">Company</label><input id="dcompany" name="company" value="${esc(d.company)}" required maxlength="80"><label class="input-label" for="darea">Location</label><input id="darea" name="area" value="${esc(d.area)}" required maxlength="80"><div class="field-grid"><div><label class="input-label" for="drate">Gross zł/hour</label><input id="drate" name="rate" type="number" min="1" max="1000" step=".01" value="${d.rate||''}" required></div><div><label class="input-label" for="ddate">Date</label><input id="ddate" name="date" type="date" value="${d.date}" required></div><div><label class="input-label" for="dstart">Start</label><input id="dstart" name="start" type="time" value="${d.start}" required></div><div><label class="input-label" for="dend">End</label><input id="dend" name="end" type="time" value="${d.end}" required></div></div><label class="input-label" for="dskills">Requirements (comma separated)</label><input id="dskills" name="requirements" value="${esc(d.requirements.join(', '))}" required><label class="input-label" for="dcategory">Category</label><select id="dcategory" name="category">${['Hospitality','Events','Retail'].map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select><p class="panel-note">A matching venue illustration and an illustrative commute will be added. No workplace photo is inferred from the request.</p><button class="button full" style="margin-top:18px">Publish reviewed shift ${icon('arrow')}</button></form>`}
function parseBrief(brief){const s=brief.toLowerCase();const type=/barista|coffee|café|cafe|kaw/.test(s)?'cafe':/event|crew|wydarzen/.test(s)?'event':/retail|shop|store|sklep/.test(s)?'retail':null;const template=initialJobs[type==='event'?1:type==='retail'?2:0];const rate=brief.match(/(\d+(?:[.,]\d+)?)\s*(?:zł|pln)/i);const times=brief.match(/(\d{1,2})(?::(\d{2}))?\s*[-–—]\s*(\d{1,2})(?::(\d{2}))?/);const iso=brief.match(/\b(2026-\d{2}-\d{2})\b/);const date=iso?iso[1]:/saturday|sobot/.test(s)?'2026-11-07':/sunday|niedziel/.test(s)?'2026-11-08':/friday|piątek|piatek/.test(s)?'2026-11-06':'';const named=brief.match(/\bat\s+(.+?)(?=\s+(?:in|on)\b|,|\d{1,2}:|$)/i);const area=/mokot/.test(s)?'Mokotów, Warsaw':/praga/.test(s)?'Praga, Warsaw':/śródmieście|srodmiescie/.test(s)?'Śródmieście, Warsaw':'';return {brief,title:type?template.title:'',company:named?.[1]?.trim()||'',category:template.category,rate:rate?+rate[1].replace(',','.'):null,date,start:times?times[1].padStart(2,'0')+':'+(times[2]||'00'):'',end:times?times[3].padStart(2,'0')+':'+(times[4]||'00'):'',area,requirements:type?template.requirements:[],scene:template.scene,commute:template.commute,description:brief,missing:[!type&&'role and skills',!named&&'company',!area&&'location',!rate&&'hourly rate',!date&&'date',!times&&'shift hours'].filter(Boolean)}}
function generateDraft(ev){ev.preventDefault();const brief=new FormData(ev.target).get('brief').trim();state.draft=parseBrief(brief);render();toast('Draft generated. Review the extracted details before publishing.')}function publishDraft(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));if(minutes(f.end)<=minutes(f.start))return toast('For this demo, choose an end time later on the same day.');const d={...state.draft,...f,id:Math.max(...state.jobs.map(j=>j.id))+1,rate:+f.rate,requirements:f.requirements.split(',').map(s=>s.trim()).filter(Boolean),scene:f.category==='Events'?'event':f.category==='Retail'?'retail':'cafe',urgent:true};delete d.missing;state.jobs.unshift(d);state.draft=null;go('overview');toast('Shift published. Switch to the worker view to discover it.')}
function shortlist(){const selected=state.candidateJob||state.jobs[0].id;const j=job(selected)||state.jobs[0];const pool=[{...state.profile,initial:'AK',commute:j.commute},{name:'Julia Nowak',initial:'JN',available:true,minRate:34,maxCommute:40,skills:['Customer service','Stock handling','Teamwork'],days:['2026-11-06','2026-11-07'],start:'09:00',end:'23:00',commute:16},{name:'Kuba Wiśniewski',initial:'KW',available:true,minRate:32,maxCommute:30,skills:['Event setup','Teamwork','Coffee making'],days:['2026-11-06','2026-11-07'],start:'07:00',end:'23:00',commute:22}];const ranked=pool.map(p=>({p,f:fit({...j,commute:p.commute},p)})).sort((a,b)=>Number(b.f.eligible)-Number(a.f.eligible)||b.f.score-a.f.score);return '<div class="panel" style="margin-top:22px"><div class="panel-head"><h3>Suggested shortlist</h3><span class="badge">3 fictional profiles</span></div><label class="input-label" for="shortlistShift">Rank candidates for</label><select id="shortlistShift" onchange="state.candidateJob=+this.value;render()">'+state.jobs.map(x=>'<option value="'+x.id+'" '+(x.id===j.id?'selected':'')+'>'+esc(x.title)+' · '+day(x.date)+'</option>').join('')+'</select>'+ranked.map(({p,f})=>'<div class="candidate"><div class="avatar">'+p.initial+'</div><div class="candidate-body"><h3>'+esc(p.name)+'</h3><p>'+f.skills.length+'/'+j.requirements.length+' relevant skills · '+p.commute+' min commute</p><div class="taglist">'+p.skills.map(s=>'<span class="tag">'+esc(s)+'</span>').join('')+'</div><p style="margin-top:10px">'+(f.eligible?'Fits this shift':!f.available?'Hours do not fit':f.conflict?'Schedule conflict':'Outside stated preferences')+'</p></div><div class="score">'+f.score+'%<small>demo fit</small></div></div>').join('')+'<p class="panel-note">A recommendation is not an application. This shortlist illustrates ranking; match and signing use Alex’s worker view.</p></div>'}function candidates(){const pending=state.applications.filter(a=>a.status==='applied');const accepted=state.applications.filter(a=>a.status!=='applied');return heading('A PERSON BEHIND EVERY PROFILE','Find your next teammate.','Review relevant skills and availability. Accept interest to open a conversation.')+`<div class="employer-grid"><div class="panel"><div class="panel-head"><h3>Workers interested in your shifts</h3><span class="badge">${pending.length} pending</span></div>${pending.length?pending.map(a=>{const j=job(a.jobId),f=fit(j);return `<div class="candidate"><div class="avatar">AK</div><div class="candidate-body"><h3>${esc(state.profile.name)} <span class="badge green">Demo verified</span></h3><p>Interested in ${esc(j.title)} · ${day(j.date)}</p><div class="taglist">${state.profile.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><p style="margin-top:12px">${f.skills.length}/${j.requirements.length} skills match · ${j.commute} min commute · ${f.eligible?'Available for this shift':f.conflict?'Conflicts with confirmed work':'Check availability and preferences'}</p><button class="button small" ${!f.eligible?'disabled':''} onclick="acceptWorker(${j.id})">Accept & open chat ${icon('check')}</button></div><div class="score">${f.score}%<small>demo fit</small></div></div>`}).join(''):empty('Your next teammate is out there.','Switch to the worker view and express interest in a shift to try matching.',`<button class="button light" onclick="setRole('worker')">Try worker view</button>`)}${accepted.length?`<h3 style="margin-top:28px">Your matches</h3>${accepted.map(a=>`<div class="request-row"><div><h3>${esc(state.profile.name)} · ${esc(job(a.jobId).title)}</h3><p>${statusText[a.status]}</p></div><button class="button light small" onclick="chat(${a.jobId})">Open chat</button></div>`).join('')}`:''}${shortlist()}</div><div><div class="panel availability"><span class="eyebrow">MATCHING YOU CAN EXPLAIN</span><h3>Relevant signals. Clear reasons.</h3><p class="panel-note">The demo score uses skills (45%), availability (25%), commute (20%), and pay preference (10%).</p><p class="panel-note">Availability, commute, pay, and conflicting confirmed shifts also act as eligibility filters. Scores help review a candidate; the employer makes the decision.</p></div></div></div>`}
function acceptWorker(id){const a=application(id);if(!a||a.status!=='applied'||!fit(job(id)).eligible)return toast('This request cannot be accepted right now.');a.status='matched';a.matchedAt=Date.now();a.messages=[{role:'system',text:'You’re matched! Confirm the shift details together, then review the demo agreement.'}];persist();render();chat(id)}
function openModal(body){modal.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:5px"><button class="close" aria-label="Close dialog" onclick="modal.close()">${icon('close')}</button></div>${body}`;const title=modal.querySelector('h2');if(title){title.id='dialogTitle';modal.setAttribute('aria-labelledby','dialogTitle')}else{modal.removeAttribute('aria-labelledby');modal.setAttribute('aria-label','Jobex dialog')}if(!modal.open)modal.showModal()}
function chat(id){const a=application(id),j=job(id);openModal(`<div class="modal-head"><div><span class="eyebrow">${state.role==='worker'?esc(j.company):esc(state.profile.name)}</span><h2>${esc(j.title)}</h2></div><span class="badge green">${statusText[a.status]}</span></div><div class="steps"><span class="done">1. Matched</span><span class="${['contract','signed','completed'].includes(a.status)?'done':''}">2. Agreement</span><span class="${['signed','completed'].includes(a.status)?'done':''}">3. Confirmed</span></div><div class="messages" id="messages">${a.messages.map(m=>`<div class="bubble ${m.role===state.role?'self':''}"><small>${m.role==='system'?'JOBEX':m.role==='worker'?esc(state.profile.name):esc(j.company)}</small>${esc(m.text)}</div>`).join('')}</div><form class="message-form" onsubmit="sendMessage(event,${id})"><input name="message" required maxlength="600" placeholder="Write a message…" aria-label="Message"><button class="button" aria-label="Send message">${icon('arrow')}</button></form><p class="panel-note">You’re acting as the ${state.role}. Switch roles to reply from the other side.</p><div style="margin-top:18px">${a.status==='matched'?state.role==='employer'?`<button class="button full" onclick="contractPreview(${id})">${icon('spark')} Prepare demo contract</button>`:`<button class="button light full" onclick="state.role='employer';state.page='candidates';render();chat(${id})">Switch to employer to prepare agreement</button>`:['contract','signed'].includes(a.status)?`<button class="button full" onclick="contractPreview(${id})">${icon('briefcase')} ${a.status==='contract'?'Review demo contract':'View signed demo agreement'}</button>`:''}${a.status==='signed'?`<button class="button subtle full" style="margin-top:10px" onclick="completeDialog(${id})">Simulate completed shift ${icon('check')}</button>`:''}${a.status==='completed'?`<button class="button full" onclick="ratingDialog(${id})">${a[state.role+'Rating']?'View your feedback':'Leave '+(state.role==='worker'?'employer':'worker')+' feedback'} ${icon('heart')}</button>`:''}</div>`);const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}
function sendMessage(ev,id){ev.preventDefault();const msg=new FormData(ev.target).get('message').trim();if(!msg)return;application(id).messages.push({role:state.role,text:msg});persist();chat(id)}
function contractPreview(id){const a=application(id),j=job(id);const canSend=a.status==='matched'&&state.role==='employer',canSign=a.status==='contract'&&state.role==='worker';openModal(`<span class="eyebrow">${a.status==='signed'||a.status==='completed'?'DEMO AGREEMENT RECORD':'AI-ASSISTED CONTRACT PREVIEW'}</span><h2>Let’s make the details clear.</h2><div class="warning">Prototype only — a non-binding summary inspired by an umowa zlecenie workflow. It is not a complete legal contract. No legal signature or identity verification occurs.</div><div class="contract-box"><div class="contract-row"><span>Employer</span><b>${esc(j.company)}</b></div><div class="contract-row"><span>Worker</span><b>${esc(state.profile.name)}</b></div><div class="contract-row"><span>Assignment</span><b>${esc(j.title)}</b></div><div class="contract-row"><span>Location</span><b>${esc(j.area)}</b></div><div class="contract-row"><span>Shift</span><b>${day(j.date)}<br>${j.start}–${j.end} (${hours(j)} hours)</b></div><div class="contract-row"><span>Gross hourly rate</span><b>${j.rate} zł</b></div><div class="contract-row"><span>Estimated gross total</span><b>${earnings(j)} zł</b></div><div class="contract-row"><span>Employer confirmation</span><b>${a.status==='matched'?'Not sent':esc(j.company)+' · simulated'}</b></div><div class="contract-row"><span>Worker confirmation</span><b>${a.signedName?esc(a.signedName)+' · simulated':'Pending'}</b></div></div>${canSend?`<p class="panel-note">Review these details before sending. A production service would need complete, reviewed terms and a suitable signing process.</p><button class="button full" style="margin-top:18px" onclick="sendContract(${id})">Confirm & send demo agreement ${icon('arrow')}</button>`:canSign?`<form onsubmit="signContract(event,${id})"><label class="input-label" for="signature">Type your name to simulate signing</label><input name="signature" id="signature" required minlength="2" maxlength="60" placeholder="${esc(state.profile.name)}"><label class="check-row"><input name="consent" type="checkbox" required>I reviewed the shift details and understand this is a non-binding demo.</label><button class="button full">Simulate signing ${icon('check')}</button></form>`:a.status==='contract'?`<button class="button full" style="margin-top:18px" onclick="state.role='worker';state.page='matches';render();contractPreview(${id})">Switch to worker & review</button>`:''}<button class="text-button" style="margin-top:18px" onclick="chat(${id})">← Back to conversation</button>`)}
function sendContract(id){const a=application(id);if(state.role!=='employer'||a.status!=='matched')return;a.status='contract';a.messages.push({role:'system',text:'The employer confirmed and sent a demo agreement. The worker can now review and simulate signing.'});persist();render();contractPreview(id)}function signContract(ev,id){ev.preventDefault();const a=application(id);if(state.role!=='worker'||a.status!=='contract')return;const f=new FormData(ev.target);if(!f.get('consent'))return;if(!fit(job(id)).eligible)return toast('This shift conflicts with your current availability. Update your profile or resolve the conflict.');a.signedName=f.get('signature').trim();a.status='signed';a.signedAt=Date.now();a.messages.push({role:'system',text:'Both sides have confirmed the demo agreement. Your shift is now on the schedule.'});persist();render();chat(id);toast('Demo agreement signed. Your shift is confirmed.')}
function completeDialog(id){openModal(`<span class="eyebrow">DEMO TIME TRAVEL</span><h2>Jump to after the shift?</h2><p style="font-size:13px;color:var(--muted)">This marks the fictional shift as completed so you can try mutual feedback and see the metrics update. No real work or payment is recorded.</p><button class="button full" onclick="completeShift(${id})">Mark demo shift completed</button>`)}function completeShift(id){const a=application(id);if(!a||a.status!=='signed')return;a.status='completed';a.completedAt=Date.now();a.larpEarned=100;state.larp.points+=100;a.messages.push({role:'system',text:'Demo shift completed. Both sides can now leave feedback.'});persist();render();shareShift(id)}let selectedRating=0;function ratingDialog(id){const a=application(id);selectedRating=a[state.role+'Rating']||0;openModal(`<span class="eyebrow">GOOD WORK DESERVES GOOD FEEDBACK</span><h2>How did the shift go?</h2><p class="panel-note">Rate your experience with ${state.role==='worker'?esc(job(id).company):esc(state.profile.name)}.</p><div class="rating-buttons" id="ratingButtons">${[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" class="${n<=selectedRating?'selected':''}" onclick="chooseRating(${n})">★</button>`).join('')}</div><button class="button full" id="ratingSubmit" ${selectedRating?'':'disabled'} onclick="saveRating(${id})">Save demo feedback</button><button class="text-button" style="margin-top:15px" onclick="state.role=state.role==='worker'?'employer':'worker';state.page=state.role==='worker'?'matches':'candidates';render();ratingDialog(${id})">Switch roles to leave the other review</button>`)}function chooseRating(n){selectedRating=n;document.querySelectorAll('#ratingButtons button').forEach((b,i)=>b.classList.toggle('selected',i<n));document.getElementById('ratingSubmit').disabled=false}function saveRating(id){if(!selectedRating)return;application(id)[state.role+'Rating']=selectedRating;persist();render();toast('Feedback saved. Switch roles to try the other review.');ratingDialog(id)}
function analytics(){const m=metrics();const ratings=state.applications.flatMap(a=>[a.workerRating,a.employerRating]).filter(Boolean);return heading('MEASURE WHAT ACTUALLY MATTERS','From a swipe to showing up.','These metrics reflect your demo actions, not real marketplace performance.')+statCards()+`<div class="profile-grid"><div class="panel"><h3>Your demo funnel</h3><div class="analytics-bars">${[['Interested',m.a.length],['Matched',m.matched.length],['Signed',m.signed.length],['Completed',m.completed.length]].map(([s,n])=>`<div><span>${s}</span><div class="progress"><span style="width:${m.a.length?n/m.a.length*100:0}%"></span></div><b>${n}</b></div>`).join('')}</div><p class="panel-note">Time to fill runs from the worker’s expression of interest to the simulated signature. Completion uses signed demo shifts as its denominator.</p></div><div class="panel"><span class="eyebrow">MUTUAL FEEDBACK</span><div style="font-size:44px;font-weight:750;margin:15px 0">${ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+' ★':'—'}</div><h3>${ratings.length} ${ratings.length===1?'rating':'ratings'} submitted</h3><p class="panel-note">Complete a signed shift in the conversation to leave worker and employer feedback. New sessions start without fabricated performance results.</p></div></div>`}
function hardReset(){try{localStorage.removeItem('jobex-v1')}catch{}location.reload()}function resetDialog(){openModal(`<h2>Reset the demo?</h2><p class="panel-note">This wipes all demo data stored in this browser: applications, saved and skipped shifts, messages, agreements, ratings, LARP points (back to 0), your LARP goal and title, the delusion slider (back to 50), the Payday Lab plan, AI-studio shifts, and every metric. Profile preferences return to the sample defaults.</p><p class="panel-note">The page reloads with the original example shifts.</p><button class="button full" style="margin-top:20px" onclick="hardReset()">Reset demo</button>`)}function wireSwipe(){const c=document.getElementById('swipeCard');if(!c)return;let start=null;c.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))start={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.5){const id=+c.dataset.job;dx>0?apply(id):skip(id)}});c.addEventListener('pointercancel',()=>start=null)}

function planHours(list=planJobs()){return list.reduce((n,j)=>n+hours(j),0)}
function planClash(a,b){return a.date===b.date&&minutes(a.start)<minutes(b.end)+45&&minutes(a.end)+45>minutes(b.start)}
function planReason(j,selected=planJobs()){if(!unlocked(j))return 'LARP tier is locked';if(application(j.id))return 'Already in your connections';if(!fit(j).eligible)return 'Outside your current preferences';if(state.applications.some(a=>a.status==='signed'&&job(a.jobId)&&planClash(j,job(a.jobId))))return 'Too close to a confirmed shift';if(selected.some(x=>x.id!==j.id&&planClash(j,x)))return 'Overlaps your plan or its 45-minute break';if(planHours(selected.filter(x=>x.id!==j.id))+hours(j)>state.payday.maxHours)return 'Exceeds your hours budget';return ''}
function planWarnings(){return planJobs().filter(j=>planReason(j)).map(j=>j.title+': '+planReason(j))}
function togglePlan(id){if(state.payday.selected.includes(id))state.payday.selected=state.payday.selected.filter(x=>x!==id);else{const reason=planReason(job(id));if(reason)return toast(reason);state.payday.selected.push(id)}render()}
function savePlanSettings(e){e.preventDefault();const f=new FormData(e.target),target=Number(f.get('target')),maxHours=Number(f.get('hours'));if(!Number.isFinite(target)||target<100||target>10000||!Number.isInteger(maxHours)||maxHours<4||maxHours>40)return;state.payday.target=target;state.payday.maxHours=maxHours;render();toast('Plan settings saved. Check any flagged shifts.')}
function suggestPlan(){if(state.payday.selected.length){openModal('<h2>Replace your draft plan?</h2><p>Your selected shifts will be replaced with a new suggestion. Your applications and confirmed shifts are unaffected.</p><button class="button full" onclick="buildPlan();modal.close()">Replace draft plan</button>');return}buildPlan()}
function buildPlan(){let selected=[];const pool=state.jobs.slice().sort((a,b)=>b.rate-a.rate||a.commute-b.commute);for(const j of pool){if(planPay(selected)>=state.payday.target)break;if(!planReason(j,selected))selected.push(j)}state.payday.selected=selected.map(j=>j.id);render();toast(selected.length?'Suggested plan ready to review':'No compatible shifts. Try changing your profile preferences or hours budget.')}
function payday(){const list=planJobs(),pay=planPay(),hrs=planHours(),target=state.payday.target,warnings=planWarnings();const candidates=state.jobs.filter(j=>!application(j.id)&&unlocked(j)&&fit(j).eligible).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));return `<section class="payday-hero"><div><span class="eyebrow">PAYDAY LAB / MAKE A PLAN</span><h1>Your free time.<br>A plan that pays.</h1><p>Pick a target. Stack compatible shifts. See what the week could look like before you send any interest.</p></div><div class="payday-orbit"><b>${Math.min(100,Math.round(pay/target*100))}%</b><small>OF YOUR GROSS TARGET</small></div></section><div class="payday-grid"><aside class="panel payday-controls"><span class="eyebrow">YOUR PARAMETERS</span><h2>What are we aiming for?</h2><form onsubmit="savePlanSettings(event)"><label class="input-label" for="paydayTarget">Gross earnings target (zł)</label><input id="paydayTarget" name="target" type="number" min="100" max="10000" step="1" value="${target}" required><label class="input-label" for="paydayHours">Maximum work hours</label><input id="paydayHours" name="hours" type="number" min="4" max="40" step="1" value="${state.payday.maxHours}" required><button class="button light full" style="margin:16px 0" type="submit">Save parameters</button></form><button class="button dark full" onclick="suggestPlan()">✦ Suggest my shift plan</button><p class="panel-note">Suggestions favor higher hourly rates, then shorter commutes. They respect availability, LARP access, your hours budget, and a 45-minute gap between shifts.</p><button class="text-button" onclick="go('profile')">Edit availability & preferences →</button><p class="panel-note">Uses the demo dates shown on each shift. The 45-minute gap is a planning buffer, not a verified travel time.</p></aside><section><div class="panel"><div class="panel-head"><h2 style="margin:0">Your draft plan</h2><span class="badge">${list.length} shifts</span></div><div class="payday-stats"><div><b>${pay} zł</b><small>potential gross pay</small></div><div><b>${hrs}h</b><small>of ${state.payday.maxHours}h budget</small></div><div><b>${hrs?(pay/hrs).toFixed(0):'—'} zł</b><small>average per hour</small></div></div><div class="progress"><span style="width:${Math.min(100,pay/target*100)}%;background:#357660"></span></div><p class="panel-note">${pay>=target?'Target reached in this draft.':`${target-pay} zł to your target.`} Gross estimates exclude taxes and expenses. A draft is not a booking.</p>${warnings.length?`<div class="warning" role="status"><b>Plan needs attention</b><br>${warnings.map(esc).join('<br>')}</div>`:''}${list.length?list.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)).map(j=>`<article class="payday-row"><div><span class="eyebrow">${day(j.date)} · ${j.start}–${j.end}</span><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${hours(j)} hours · ${j.rate} zł/h</p><div class="row-actions"><button class="button small" onclick="details(${j.id})">Review & express interest</button><button class="text-button" onclick="togglePlan(${j.id})">Remove from plan</button></div></div><span class="badge green">${earnings(j)} zł</span></article>`).join(''):`<div class="payday-empty">Your next payday starts here.<br>Generate a suggestion or add shifts below.</div>`}</div><div class="panel" style="margin-top:22px"><h2>Build it your way</h2><p class="panel-note">All eligible demo offers, including ones you passed in Discover. You choose the final mix.</p>${candidates.length?candidates.map(j=>{const selected=state.payday.selected.includes(j.id),reason=selected?'':planReason(j);return `<article class="payday-row"><div><h3>${esc(j.title)}</h3><p>${day(j.date)} · ${j.start}–${j.end} · ${j.rate} zł/h · ${j.commute} min commute</p>${reason?`<p style="margin-top:8px">${esc(reason)}</p>`:''}</div><button class="button ${selected?'subtle':'light'}" ${reason?'disabled':''} onclick="togglePlan(${j.id})">${selected?'Remove':'Add · '+earnings(j)+' zł'}</button></article>`}).join(''):`<div class="payday-empty">No eligible shifts. Update your preferences to see more options.</div>`}</div></section></div>`}
render();
</script></body></html>

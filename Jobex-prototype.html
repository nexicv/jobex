const I={spark:'M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3z',cards:'M5 5h14v16H5z M8 2h14v16',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z',calendar:'M4 5h16v16H4z M4 10h16 M8 2v6 M16 2v6',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 22v-3a8 8 0 0 1 16 0v3',pin:'M19 9c0 5-7 12-7 12S5 14 5 9a7 7 0 1 1 14 0z M14 9a2 2 0 1 1-4 0 2 2 0 0 1 4 0',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 6v6l4 2',check:'M5 12l4 4L19 6',close:'M6 6l12 12 M18 6L6 18',bookmark:'M6 3h12v18l-6-4-6 4z',arrow:'M4 12h16 M14 6l6 6-6 6',back:'M20 12H4 M10 6l-6 6 6 6',sliders:'M3 6h18 M3 12h18 M3 18h18 M8 3v6 M16 9v6 M10 15v6',chat:'M3 4h18v13H8l-5 4z',briefcase:'M3 7h18v14H3z M8 7V3h8v4 M3 12h18 M10 12v3h4v-3',chart:'M4 3v18h18 M8 16v-4 M13 16V8 M18 16V5',plus:'M12 4v16 M4 12h16',shield:'M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6z M8 11l3 3 5-5',coffee:'M4 8h13v8a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z M17 8h2a3 3 0 1 1 0 6h-2 M7 2v3 M12 2v3',refresh:'M20 7V2l-4 4 M20 7a9 9 0 1 0 1 8'};function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${I[n]||I.spark}"/></svg>`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const initialJobs=[{id:1,title:'Barista for a day',company:'MOKO Coffee',category:'Hospitality',rate:35,date:'2026-11-06',start:'08:00',end:'16:00',area:'Mokotów, Warsaw',commute:12,requirements:['Coffee making','Customer service'],description:'Help our friendly café team through the Friday rush. Prepare coffees, welcome customers, and keep the counter looking good.',urgent:true,scene:'cafe'},{id:2,title:'Event crew wanted',company:'Studio Praga',category:'Events',rate:38,date:'2026-11-07',start:'15:00',end:'23:00',area:'Praga, Warsaw',commute:24,requirements:['Teamwork','Event setup'],description:'Help set up a local design event, welcome guests, and support the team through the evening.',urgent:false,scene:'event'},{id:3,title:'A fresh retail shift',company:'Form & Field',category:'Retail',rate:33,date:'2026-11-06',start:'10:00',end:'18:00',area:'Śródmieście, Warsaw',commute:18,requirements:['Customer service','Stock handling'],description:'Join a small homewares store for a busy Friday. Help customers, refresh the displays, and organise new arrivals.',urgent:true,scene:'retail'}];
const seed=()=>({role:'worker',page:'discover',filter:'All shifts',jobs:JSON.parse(JSON.stringify(initialJobs)),skipped:[],saved:[],applications:[],profile:{name:'Alex Kowalski',available:true,minRate:30,maxCommute:30,skills:['Coffee making','Customer service','Teamwork'],days:['2026-11-06','2026-11-07'],start:'07:00',end:'23:00'},draft:null,sessionStart:Date.now()});let state=seed();try{const v=JSON.parse(localStorage.getItem('jobex-v1'));if(v?.jobs&&v?.profile)state=v}catch{}let toastTimer;const main=document.getElementById('main'),modal=document.getElementById('modal');function persist(){try{localStorage.setItem('jobex-v1',JSON.stringify(state))}catch{}}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3800)}function job(id){return state.jobs.find(j=>j.id===id)}function application(id){return state.applications.find(a=>a.jobId===id)}function hours(j){return (minutes(j.end)-minutes(j.start))/60}function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function earnings(j){return (hours(j)*j.rate).toFixed(0)}function day(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}function fit(j,p=state.profile){let skills=j.requirements.filter(s=>p.skills.includes(s));let available=p.available&&p.days.includes(j.date)&&minutes(j.start)>=minutes(p.start)&&minutes(j.end)<=minutes(p.end);let travel=j.commute<=p.maxCommute;let pay=j.rate>=p.minRate;let conflict=(p===state.profile||p.initial==='AK')&&state.applications.some(a=>a.status==='signed'&&a.jobId!==j.id&&job(a.jobId).date===j.date&&minutes(j.start)<minutes(job(a.jobId).end)&&minutes(j.end)>minutes(job(a.jobId).start));return {skills,available,travel,pay,conflict,score:Math.round((skills.length/Math.max(1,j.requirements.length))*45+(available?25:0)+(travel?20:0)+(pay?10:0)),eligible:available&&travel&&pay&&!conflict}}
function scene(type){let art=type==='cafe'?`<rect width="600" height="250" fill="#b6a28d"/><rect x="30" width="210" height="200" fill="#d9e5de"/><path d="M30 70h210M30 140h210M100 0v200M170 0v200" stroke="#556e62" stroke-width="8"/><path d="M0 170L300 0h120L80 250H0" fill="#fff3d32b"/><rect x="290" y="65" width="260" height="12" fill="#694c39"/><rect x="305" y="25" width="27" height="40" rx="3" fill="#7c654b"/><rect x="345" y="36" width="30" height="29" rx="3" fill="#e5d0ac"/><path d="M425 65V28q20-22 35 0v37" fill="#798967"/><rect x="468" y="23" width="55" height="42" rx="3" fill="#a87953"/><rect x="280" y="105" width="180" height="70" rx="8" fill="#3a4c44"/><rect x="291" y="114" width="158" height="20" rx="3" fill="#9eaaa0"/><circle cx="315" cy="124" r="5" fill="#e1cf99"/><path d="M340 140v16m35-16v16m35-16v16" stroke="#bdc2b4" stroke-width="7"/><rect x="330" y="157" width="25" height="18" rx="4" fill="#f0e7cf"/><rect x="365" y="157" width="25" height="18" rx="4" fill="#f0e7cf"/><rect y="179" width="600" height="20" fill="#77543c"/><rect y="199" width="600" height="51" fill="#9c7756"/><path d="M0 208h600M50 199v51m80-51v51m80-51v51m80-51v51m80-51v51m80-51v51m80-51v51" stroke="#805e45" stroke-width="2"/><ellipse cx="136" cy="174" rx="45" ry="8" fill="#92704d"/><path d="M108 135h55v35q-25 14-55 0z" fill="#eee3ca"/><path d="M163 140h8q20 12 0 23h-8" fill="none" stroke="#eee3ca" stroke-width="7"/><path d="M126 125q-12-15 2-30m20 30q-12-15 2-30" stroke="#eee3ca99" stroke-width="4" fill="none"/><rect x="510" y="142" width="35" height="37" fill="#bf986d"/><path d="M528 145v-36m0 17q-40-25-32-40 28-4 32 40m0-9q32-27 40-12-4 26-40 26" fill="#617a52" stroke="#617a52" stroke-width="4"/>` : type==='event'?`<rect width="600" height="250" fill="#3c3559"/><path d="M50 0l120 250H0zM420 0l160 250H320z" fill="#b994ed24"/><rect x="90" y="85" width="420" height="130" rx="8" fill="#65548b"/><path d="M115 110h370v80H115z" fill="#ab92c2"/><text x="300" y="162" font-family="sans-serif" font-weight="bold" font-size="34" text-anchor="middle" fill="#f1e5ff" letter-spacing="7">AFTER HOURS</text><path d="M0 35Q300 100 600 35" stroke="#d9caee" fill="none" stroke-width="2"/><g fill="#f5db92"><circle cx="60" cy="47" r="5"/><circle cx="150" cy="61" r="5"/><circle cx="240" cy="67" r="5"/><circle cx="330" cy="68" r="5"/><circle cx="420" cy="62" r="5"/><circle cx="510" cy="49" r="5"/></g><rect y="215" width="600" height="35" fill="#29263d"/><path d="M45 250v-80h30v80m450 0v-80h30v80" stroke="#191b2c" fill="#191b2c"/>`:`<rect width="600" height="250" fill="#ddd1bc"/><rect x="65" y="30" width="200" height="170" rx="80" fill="#a5b0a1"/><path d="M60 85h210M165 25v180" stroke="#e9e1d3" stroke-width="7"/><path d="M310 65h240m-240 70h240m-240 70h240" stroke="#917456" stroke-width="9"/><g fill="#b77557"><path d="M330 65V40q15-20 30 0v25z"/><path d="M430 135V95h35v40z"/></g><g fill="#f5eddb"><path d="M390 65V28h24v37z"/><path d="M495 65V30h32v35z"/><path d="M335 135V98h45v37z"/><path d="M485 135V99q15-20 30 0v36z"/></g><rect x="330" y="170" width="70" height="30" fill="#9fa688"/><rect x="430" y="169" width="90" height="30" fill="#c1a17c"/><rect y="217" width="600" height="33" fill="#c6af92"/><ellipse cx="160" cy="182" rx="75" ry="13" fill="#b18c64"/><path d="M103 183v67m113-67v67" stroke="#906d4d" stroke-width="9"/><path d="M160 178v-65m0 25q-45-35-50-7 10 30 50 29m0-8q40-40 48-10-10 25-48 25" fill="#5e7656" stroke="#5e7656" stroke-width="5"/>`;return `<svg viewBox="0 0 600 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated ${type==='cafe'?'coffee shop':type==='event'?'event venue':'retail shop'}"><defs><linearGradient id="shade" x2="0" y2="1"><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs>${art}<rect width="600" height="250" fill="url(#shade)"/></svg>`}
const menus={worker:[['discover','cards','Discover'],['matches','chat','Connections'],['shifts','calendar','My shifts'],['profile','user','My profile']],employer:[['overview','briefcase','Overview'],['studio','spark','AI shift studio'],['candidates','user','Candidates'],['analytics','chart','Insights']]};function setRole(r){state.role=r;state.page=r==='worker'?'discover':'overview';render()}function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){persist();const items=menus[state.role];const nav=items.map(([p,i,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')" title="${t}">${icon(i)}<span class="nav-label">${t}</span>${p==='matches'&&state.applications.length?`<span class="nav-count">${state.applications.length}</span>`:''}</button>`).join('');document.getElementById('nav').innerHTML=nav;document.getElementById('mobileNav').innerHTML=items.map(([p,i,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${icon(i)}${t}</button>`).join('');document.getElementById('crumb').textContent=items.find(x=>x[0]===state.page)?.[2]||'Discover';document.getElementById('workerRole').classList.toggle('active',state.role==='worker');document.getElementById('employerRole').classList.toggle('active',state.role==='employer');document.getElementById('identityName').textContent=state.role==='worker'?state.profile.name:'MOKO Coffee';document.getElementById('identityAvatar').textContent=state.role==='worker'?'AK':'MC';document.getElementById('identitySub').textContent=state.role==='worker'?'Worker · Warsaw':'Employer workspace';main.innerHTML=`<div class="fade">${({discover,matches,shifts,profile,overview,studio,candidates,analytics}[state.page]||discover)()}</div><div class="bottom-strip"><span>Prototype · Fictional profiles and shifts · Simulated AI, checks & signing</span><button class="text-button" onclick="resetDialog()">Reset demo</button></div>`;wireSwipe()}
function heading(ey,title,sub,action=''){return `<div class="heading"><div><span class="eyebrow">${ey}</span><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function empty(title,body,action=''){return `<div class="empty"><div class="empty-symbol">${icon('spark')}</div><h2>${title}</h2><p>${body}</p>${action}</div>`}function currentJobs(){return state.jobs.filter(j=>!state.skipped.includes(j.id)&&!application(j.id)&&fit(j).eligible&&(state.filter==='All shifts'||state.filter===j.category||state.filter==='Saved'&&state.saved.includes(j.id))).sort((a,b)=>fit(b).score-fit(a).score)}
function discover(){const list=currentJobs(),j=list[0];return heading('FLEXIBLE WORK. REAL POSSIBILITIES.','Your next shift starts here.','A little extra income. A new experience. A shift that fits you.',`<button class="button light" onclick="go('profile')">${icon('sliders')} My preferences</button>`)+`<div class="discovery"><section class="feed"><div class="filterbar">${['All shifts','Hospitality','Events','Retail','Saved'].map(f=>`<button class="chip ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f==='Saved'?icon('bookmark'):''}${f}</button>`).join('')}</div>${j?`<div class="job-wrap"><article class="job-card" id="swipeCard" data-job="${j.id}">${card(j)}</article></div><div class="swipe-actions"><div><button class="round skip" aria-label="Pass on this shift" onclick="skip(${j.id})">${icon('close')}</button><div class="action-label">PASS</div></div><div><button class="round like" aria-label="I'm interested in this shift" onclick="apply(${j.id})">${icon('heart')}</button><div class="action-label">I'M INTERESTED</div></div><div><button class="round" aria-label="View shift details" onclick="details(${j.id})">${icon('briefcase')}</button><div class="action-label">DETAILS</div></div></div><p class="swipe-hint">Swipe or tap to choose · ${list.length} suitable ${list.length===1?'shift':'shifts'} to explore</p>`:empty('You’re all caught up.',state.filter==='Saved'?'Save a shift using the bookmark to find it here.':'Check your connections, adjust your availability, or bring back passed shifts.',`<button class="button" onclick="go('matches')">View connections ${icon('arrow')}</button> <button class="button light" onclick="state.skipped=[];state.filter='All shifts';render()">Restore passed shifts</button>`)}</section><aside><div class="panel availability"><div class="panel-head"><h3>Your availability</h3><button class="switch ${state.profile.available?'on':''}" role="switch" aria-checked="${state.profile.available}" aria-label="Available for shifts" onclick="state.profile.available=!state.profile.available;render()"><span></span></button></div><div class="status-line"><span class="dot"></span>${state.profile.available?'Open to a good opportunity':'Taking a break'}</div>${state.profile.days.map(d=>`<div class="schedule-line"><b>${day(d)}</b><span>${state.profile.start}–${state.profile.end}</span></div>`).join('')}<button class="text-button" style="margin-top:13px" onclick="go('profile')">Edit availability ↗</button></div><div class="panel"><div class="panel-head"><h3>Made for your life</h3>${icon('spark')}</div><div class="fit-row"><div class="fit-icon">${icon('pin')}</div><div><b>Keep it local</b><p>Up to ${state.profile.maxCommute} minutes away.<br>More earning, less commuting.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('calendar')}</div><div><b>Your time comes first</b><p>Shifts that fit your available hours.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('shield')}</div><div><b>Know before you go</b><p>Clear rates, requirements and a contract preview.</p></div></div></div><div class="panel tip-panel"><span class="eyebrow">LESS PAPERWORK. MORE POSSIBILITY.</span><h3>Your skills are<br>your introduction.</h3><p>Show what you can do.<br>Leave the long CV behind.</p><button class="button lime small" onclick="go('profile')">Explore your profile ${icon('arrow')}</button></div></aside></div>`}
function card(j){const f=fit(j);return `<div class="scene">${scene(j.scene)}<div class="scene-top"><span class="badge ${j.urgent?'lime':'white'}">${j.urgent?'↗ Hiring now':'A little change of scene'}</span><button class="save-btn" aria-label="${state.saved.includes(j.id)?'Unsave':'Save'} shift" onclick="saveJob(${j.id})" style="color:${state.saved.includes(j.id)?'var(--purple)':'var(--ink)'}">${icon('bookmark')}</button></div><span class="scene-caption">${esc(j.company.toUpperCase())} / WARSAW</span></div><div class="card-content"><div class="company">${esc(j.company)} ${icon('shield')} Demo verified</div><div class="job-title"><div><h2>${esc(j.title)}</h2><span class="duration">${esc(j.category)} · One shift</span></div><div class="rate">${j.rate} zł<small>gross / hour</small></div></div><div class="meta"><span>${icon('pin')}${esc(j.area)}</span><span>${icon('clock')}${j.commute} min commute*</span></div><div class="job-info"><div><span class="mini-label">YOUR SHIFT</span><b>${day(j.date)} · ${j.start}–${j.end}</b></div><div><span class="mini-label">ESTIMATED GROSS PAY</span><b>${earnings(j)} zł <span style="font-weight:400;color:var(--muted)">/ ${hours(j)} hours</span></b></div></div><div class="taglist">${j.requirements.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}<span class="tag">No CV needed</span></div><div class="ai-reason">${icon('spark')}<span><b>${f.score}% demo match.</b> ${f.skills.length?`${f.skills.length} relevant skills`:'A chance to build new skills'} · ${f.available?'fits your hours':'check availability'} · ${f.travel?'within your commute':'longer commute'}.</span></div></div>`}
function saveJob(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render()}function skip(id){state.skipped.push(id);render()}function apply(id){if(application(id))return;if(!fit(job(id)).eligible)return toast('This shift no longer fits your availability.');state.applications.push({jobId:id,status:'applied',appliedAt:Date.now(),messages:[],workerRating:0,employerRating:0});render();toast('Interest sent! Switch to “I’m hiring” to accept as the employer.')}
function details(id){const j=job(id);openModal(`<span class="eyebrow">THE DETAILS</span><h2>${esc(j.title)}</h2><p class="panel-note">${esc(j.company)} · ${esc(j.area)}</p><p style="margin-top:20px;font-size:13px">${esc(j.description)}</p><div class="contract-box"><div class="contract-row"><span>When</span><b>${day(j.date)}, ${j.start}–${j.end}</b></div><div class="contract-row"><span>Gross rate</span><b>${j.rate} zł / hour</b></div><div class="contract-row"><span>Expected gross pay</span><b>${earnings(j)} zł</b></div><div class="contract-row"><span>Requirements</span><b>${esc(j.requirements.join(', '))}</b></div></div><p class="panel-note">*Commute times are illustrative. Profile checks are simulated in this prototype.</p><button class="button full" style="margin-top:18px" ${application(id)||!fit(j).eligible?'disabled':''} onclick="apply(${id});modal.close()">${application(id)?'Interest already sent':'I’m interested'}</button>`)}
function matches(){return heading('YOUR NEXT CONVERSATION','Good things start with a hello.','Track your interest, meet the team, and agree the details.')+`<div class="match-grid">${state.applications.length?state.applications.map(a=>matchCard(a)).join(''):empty('Make the first move.','Tap the heart on a shift you like to start a connection.',`<button class="button" onclick="go('discover')">Discover shifts ${icon('arrow')}</button>`)}</div>`}const statusText={applied:'Interest sent',matched:'It’s a match',contract:'Contract ready',signed:'Shift confirmed',completed:'Shift completed'};function matchCard(a){let j=job(a.jobId);return `<article class="panel match-card"><span class="badge ${a.status==='applied'?'orange':'green'}">${statusText[a.status]}</span><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${day(j.date)}<br>${j.start}–${j.end} · ${earnings(j)} zł gross</p><div class="progress"><span style="width:${({applied:20,matched:40,contract:60,signed:80,completed:100})[a.status]}%"></span></div><span class="duration">${a.status==='applied'?'Waiting for the employer to review your profile.':a.status==='matched'?'You can now chat and review the shift details.':a.status==='contract'?'Review the demo agreement before signing.':a.status==='signed'?'Both parties have signed the demo agreement.':'Thanks for showing up. Leave mutual feedback.'}</span><div>${a.status==='applied'?`<button class="button light" onclick="setRole('employer');go('candidates')">Review as employer ${icon('arrow')}</button>`:`<button class="button" onclick="chat(${j.id})">Open conversation ${icon('chat')}</button>`}</div></article>`}
function shifts(){const a=state.applications.filter(a=>['signed','completed'].includes(a.status));return heading('A LITTLE PLAN FOR WHAT’S NEXT','Your shifts, sorted.','Confirmed work and your completed shifts in one place.')+`<div class="match-grid">${a.length?a.map(matchCard).join(''):empty('Your schedule is open.','After both sides sign a demo agreement, your shift will appear here.',`<button class="button" onclick="go('matches')">View connections</button>`)}</div>`}
function profile(){const p=state.profile;return heading('MORE THAN A CV','A few details. Better matches.','Your preferences directly change which shifts appear in Discover.')+`<div class="profile-grid"><form class="panel" onsubmit="saveProfile(event)"><div class="panel-head"><h3>Your worker profile</h3><span class="badge green">Demo verified</span></div><label class="input-label" for="pname">Name</label><input id="pname" name="name" required maxlength="60" value="${esc(p.name)}"><div class="field-grid"><div><label class="input-label" for="minrate">Minimum gross rate (zł/hour)</label><input id="minrate" name="minRate" type="number" min="1" max="500" value="${p.minRate}" required></div><div><label class="input-label" for="commute">Maximum commute (minutes)</label><input id="commute" name="maxCommute" type="number" min="5" max="120" value="${p.maxCommute}" required></div></div><label class="input-label">Available days</label>${['2026-11-06','2026-11-07','2026-11-08'].map(d=>`<label class="check-row"><input name="days" type="checkbox" value="${d}" ${p.days.includes(d)?'checked':''}>${day(d)}</label>`).join('')}<div class="field-grid"><div><label class="input-label" for="pstart">From</label><input id="pstart" name="start" type="time" value="${p.start}" required></div><div><label class="input-label" for="pend">Until</label><input id="pend" name="end" type="time" value="${p.end}" required></div></div><label class="input-label">Your skills</label><div class="field-grid">${['Coffee making','Customer service','Teamwork','Event setup','Stock handling'].map(s=>`<label class="check-row"><input name="skills" type="checkbox" value="${s}" ${p.skills.includes(s)?'checked':''}>${s}</label>`).join('')}</div><button class="button full" style="margin-top:20px">Save preferences ${icon('check')}</button></form><div><div class="panel"><span class="eyebrow">WHY THIS MATTERS</span><h2>A useful match has a reason.</h2><p class="panel-note">The demo ranks skill overlap, available hours, commute, and preferred pay. Confirmed shifts are checked for schedule conflicts.</p><div class="fit-row" style="margin-top:25px"><div class="fit-icon">${icon('shield')}</div><div><b>Skills and identity checks</b><p>Badges are examples only. No identity documents have been collected or verified.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('user')}</div><div><b>You stay in control</b><p>You choose the opportunities and review the terms before committing.</p></div></div></div><div class="panel availability"><h3>Your matching inputs</h3><p class="panel-note">${p.skills.length} skills · ${p.days.length} available days<br>At least ${p.minRate} zł gross/hour · Up to ${p.maxCommute} minutes away</p></div></div></div>`}
function saveProfile(ev){ev.preventDefault();const f=new FormData(ev.target);if(minutes(f.get('end'))<=minutes(f.get('start')))return toast('Choose an end time after your start time.');state.profile={...state.profile,name:f.get('name').trim(),minRate:+f.get('minRate'),maxCommute:+f.get('maxCommute'),start:f.get('start'),end:f.get('end'),days:f.getAll('days'),skills:f.getAll('skills')};render();toast('Preferences saved. Your shift matches have been updated.')}
function metrics(){const a=state.applications,signed=a.filter(x=>['signed','completed'].includes(x.status)),matched=a.filter(x=>x.status!=='applied'),completed=a.filter(x=>x.status==='completed');return {a,signed,matched,completed,fill:signed.length?Math.round(signed.reduce((t,x)=>t+(x.signedAt-x.appliedAt)/60000,0)/signed.length):null,conversion:a.length?Math.round(matched.length/a.length*100):null,completion:signed.length?Math.round(completed.length/signed.length*100):null}}function statCards(){const m=metrics();return `<div class="stat-grid"><div class="stat"><span class="mini-label">AVG. TIME TO FILL</span><div class="value">${m.fill===null?'—':m.fill<1?'<1 min':m.fill+' min'}</div><em>Target: under 2 hours</em></div><div class="stat"><span class="mini-label">INTEREST → MATCH</span><div class="value">${m.conversion===null?'—':m.conversion+'%'}</div><small>${m.matched.length} matched / ${m.a.length} interested</small></div><div class="stat"><span class="mini-label">SHIFT COMPLETION</span><div class="value">${m.completion===null?'—':m.completion+'%'}</div><small>${m.completed.length} completed / ${m.signed.length} signed</small></div><div class="stat"><span class="mini-label">ACTIVE SHIFT CARDS</span><div class="value">${state.jobs.length}</div><small>Across your demo workspace</small></div></div>`}
function overview(){return heading('THE RIGHT HELP, RIGHT WHEN YOU NEED IT','A full team. A lighter day.','Create a shift, find the fit, and get the details agreed.',`<button class="button" onclick="go('studio')">${icon('plus')} Create a shift</button>`)+statCards()+`<div class="employer-grid"><div class="panel"><div class="panel-head"><h3>Your shift board</h3><span class="badge">${state.jobs.length} shifts</span></div>${state.jobs.map(j=>{const a=application(j.id);return `<div class="request-row"><div><h3>${esc(j.title)}</h3><p>${esc(j.company)} · ${day(j.date)} · ${j.start}–${j.end}<br>${j.rate} zł gross/hour · ${esc(j.area)}</p></div><div class="row-actions">${a?`<span class="badge ${a.status==='applied'?'orange':'green'}">${statusText[a.status]}</span>`:'<span class="badge">Open</span>'}<button class="button light small" onclick="${a&&a.status!=='applied'?`chat(${j.id})`:`go('candidates')`}">${a&&a.status!=='applied'?'Open chat':'Candidates'} ${icon('arrow')}</button></div></div>`}).join('')}</div><div><div class="panel tip-panel"><span class="eyebrow">MEET YOUR SHIFT ASSISTANT</span><h3>One sentence.<br>A shift ready to share.</h3><p>Describe the help you need. Review a structured card with the essential details.</p><button class="button lime" onclick="go('studio')">Try the AI studio ${icon('spark')}</button></div><div class="panel"><h3>Try the complete journey</h3><div class="fit-row"><div class="fit-icon">1</div><div><b>Swipe as a worker</b><p>Express interest in a suitable shift.</p></div></div><div class="fit-row"><div class="fit-icon">2</div><div><b>Match as an employer</b><p>Accept the worker and send a draft.</p></div></div><div class="fit-row"><div class="fit-icon">3</div><div><b>Confirm, complete, review</b><p>Try both roles in the conversation.</p></div></div></div></div></div>`}
const examples={cafe:'Need a barista at MOKO Coffee in Mokotów on Friday, 08:00–16:00, 35 zł/hour. Coffee making and customer service experience.',event:'Need event crew at Studio Praga on Saturday, 15:00–23:00, 38 zł/hour. Teamwork and event setup.',retail:'Need a retail assistant at Form & Field in Śródmieście on Friday, 10:00–18:00, 33 zł/hour. Customer service and stock handling.'};
function studio(){return heading('FROM A QUICK THOUGHT TO A CLEAR OPPORTUNITY','Meet your shift assistant.','Describe the help you need. Review the details before publishing.')+`<div class="studio"><div><form class="panel" onsubmit="generateDraft(event)"><div class="panel-head"><h3>What does your team need?</h3><span class="badge">✦ AI demo</span></div><label class="input-label" for="brief">Your staffing request</label><textarea id="brief" name="brief" placeholder="E.g. Need a barista in Mokotów on Friday, 08:00–16:00, 35 zł/hour…" required minlength="15" maxlength="1500">${esc(state.draft?.brief||examples.cafe)}</textarea><div class="example-chips"><span class="panel-note" style="margin:4px 0">Try an example:</span>${Object.keys(examples).map(k=>`<button type="button" onclick="document.getElementById('brief').value=examples['${k}']">${{cafe:'☕ Café',event:'✦ Event',retail:'↗ Retail'}[k]}</button>`).join('')}</div><button class="button full" id="generateButton">${icon('spark')} Generate shift card</button><p class="panel-note">This prototype uses local text parsing and example templates. No external AI service is connected.</p></form><div class="panel"><h3>What the assistant looks for</h3><div class="fit-row"><div class="fit-icon">${icon('briefcase')}</div><div><b>Role and essential skills</b><p>A clear title and a concise list of requirements.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('clock')}</div><div><b>When, where, and how much</b><p>Shift hours, area and gross hourly rate.</p></div></div><div class="fit-row"><div class="fit-icon">${icon('user')}</div><div><b>Who could fit</b><p>Rank workers against the reviewed shift details.</p></div></div></div></div><section id="draftArea">${draftForm()}</section></div>`}
function draftForm(){const d=state.draft;if(!d)return `<div class="draft-box empty"><div class="empty-symbol">${icon('cards')}</div><h2>Your next shift, taking shape.</h2><p>Generate a card to see the extracted details here. You can edit everything before it goes live.</p></div>`;return `<form class="panel" onsubmit="publishDraft(event)"><div class="panel-head"><h3>Review your shift card</h3><span class="badge green">Draft ready</span></div>${d.missing.length?`<div class="warning">Please supply or confirm: ${esc(d.missing.join(', '))}. These details could not be read confidently.</div>`:''}<label class="input-label" for="dtitle">Role</label><input id="dtitle" name="title" value="${esc(d.title)}" required maxlength="80"><label class="input-label" for="dcompany">Company</label><input id="dcompany" name="company" value="${esc(d.company)}" required maxlength="80"><label class="input-label" for="darea">Location</label><input id="darea" name="area" value="${esc(d.area)}" required maxlength="80"><div class="field-grid"><div><label class="input-label" for="drate">Gross zł/hour</label><input id="drate" name="rate" type="number" min="1" max="1000" step=".01" value="${d.rate||''}" required></div><div><label class="input-label" for="ddate">Date</label><input id="ddate" name="date" type="date" value="${d.date}" required></div><div><label class="input-label" for="dstart">Start</label><input id="dstart" name="start" type="time" value="${d.start}" required></div><div><label class="input-label" for="dend">End</label><input id="dend" name="end" type="time" value="${d.end}" required></div></div><label class="input-label" for="dskills">Requirements (comma separated)</label><input id="dskills" name="requirements" value="${esc(d.requirements.join(', '))}" required><label class="input-label" for="dcategory">Category</label><select id="dcategory" name="category">${['Hospitality','Events','Retail'].map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select><p class="panel-note">A matching venue illustration and an illustrative commute will be added. No workplace photo is inferred from the request.</p><button class="button full" style="margin-top:18px">Publish reviewed shift ${icon('arrow')}</button></form>`}
function parseBrief(brief){const s=brief.toLowerCase();const type=/barista|coffee|café|cafe|kaw/.test(s)?'cafe':/event|crew|wydarzen/.test(s)?'event':/retail|shop|store|sklep/.test(s)?'retail':null;const template=initialJobs[type==='event'?1:type==='retail'?2:0];const rate=brief.match(/(\d+(?:[.,]\d+)?)\s*(?:zł|pln)/i);const times=brief.match(/(\d{1,2})(?::(\d{2}))?\s*[-–—]\s*(\d{1,2})(?::(\d{2}))?/);const iso=brief.match(/\b(2026-\d{2}-\d{2})\b/);const date=iso?iso[1]:/saturday|sobot/.test(s)?'2026-11-07':/sunday|niedziel/.test(s)?'2026-11-08':/friday|piątek|piatek/.test(s)?'2026-11-06':'';const named=brief.match(/\bat\s+(.+?)(?=\s+(?:in|on)\b|,|\d{1,2}:|$)/i);const area=/mokot/.test(s)?'Mokotów, Warsaw':/praga/.test(s)?'Praga, Warsaw':/śródmieście|srodmiescie/.test(s)?'Śródmieście, Warsaw':'';return {brief,title:type?template.title:'',company:named?.[1]?.trim()||'',category:template.category,rate:rate?+rate[1].replace(',','.'):null,date,start:times?times[1].padStart(2,'0')+':'+(times[2]||'00'):'',end:times?times[3].padStart(2,'0')+':'+(times[4]||'00'):'',area,requirements:type?template.requirements:[],scene:template.scene,commute:template.commute,description:brief,missing:[!type&&'role and skills',!named&&'company',!area&&'location',!rate&&'hourly rate',!date&&'date',!times&&'shift hours'].filter(Boolean)}}
function generateDraft(ev){ev.preventDefault();const brief=new FormData(ev.target).get('brief').trim();state.draft=parseBrief(brief);render();toast('Draft generated. Review the extracted details before publishing.')}function publishDraft(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));if(minutes(f.end)<=minutes(f.start))return toast('For this demo, choose an end time later on the same day.');const d={...state.draft,...f,id:Math.max(...state.jobs.map(j=>j.id))+1,rate:+f.rate,requirements:f.requirements.split(',').map(s=>s.trim()).filter(Boolean),scene:f.category==='Events'?'event':f.category==='Retail'?'retail':'cafe',urgent:true};delete d.missing;state.jobs.unshift(d);state.draft=null;go('overview');toast('Shift published. Switch to the worker view to discover it.')}
function shortlist(){const selected=state.candidateJob||state.jobs[0].id;const j=job(selected)||state.jobs[0];const pool=[{...state.profile,initial:'AK',commute:j.commute},{name:'Julia Nowak',initial:'JN',available:true,minRate:34,maxCommute:40,skills:['Customer service','Stock handling','Teamwork'],days:['2026-11-06','2026-11-07'],start:'09:00',end:'23:00',commute:16},{name:'Kuba Wiśniewski',initial:'KW',available:true,minRate:32,maxCommute:30,skills:['Event setup','Teamwork','Coffee making'],days:['2026-11-06','2026-11-07'],start:'07:00',end:'23:00',commute:22}];const ranked=pool.map(p=>({p,f:fit({...j,commute:p.commute},p)})).sort((a,b)=>Number(b.f.eligible)-Number(a.f.eligible)||b.f.score-a.f.score);return '<div class="panel" style="margin-top:22px"><div class="panel-head"><h3>Suggested shortlist</h3><span class="badge">3 fictional profiles</span></div><label class="input-label" for="shortlistShift">Rank candidates for</label><select id="shortlistShift" onchange="state.candidateJob=+this.value;render()">'+state.jobs.map(x=>'<option value="'+x.id+'" '+(x.id===j.id?'selected':'')+'>'+esc(x.title)+' · '+day(x.date)+'</option>').join('')+'</select>'+ranked.map(({p,f})=>'<div class="candidate"><div class="avatar">'+p.initial+'</div><div class="candidate-body"><h3>'+esc(p.name)+'</h3><p>'+f.skills.length+'/'+j.requirements.length+' relevant skills · '+p.commute+' min commute</p><div class="taglist">'+p.skills.map(s=>'<span class="tag">'+esc(s)+'</span>').join('')+'</div><p style="margin-top:10px">'+(f.eligible?'Fits this shift':!f.available?'Hours do not fit':f.conflict?'Schedule conflict':'Outside stated preferences')+'</p></div><div class="score">'+f.score+'%<small>demo fit</small></div></div>').join('')+'<p class="panel-note">A recommendation is not an application. This shortlist illustrates ranking; match and signing use Alex’s worker view.</p></div>'}function candidates(){const pending=state.applications.filter(a=>a.status==='applied');const accepted=state.applications.filter(a=>a.status!=='applied');return heading('A PERSON BEHIND EVERY PROFILE','Find your next teammate.','Review relevant skills and availability. Accept interest to open a conversation.')+`<div class="employer-grid"><div class="panel"><div class="panel-head"><h3>Workers interested in your shifts</h3><span class="badge">${pending.length} pending</span></div>${pending.length?pending.map(a=>{const j=job(a.jobId),f=fit(j);return `<div class="candidate"><div class="avatar">AK</div><div class="candidate-body"><h3>${esc(state.profile.name)} <span class="badge green">Demo verified</span></h3><p>Interested in ${esc(j.title)} · ${day(j.date)}</p><div class="taglist">${state.profile.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><p style="margin-top:12px">${f.skills.length}/${j.requirements.length} skills match · ${j.commute} min commute · ${f.eligible?'Available for this shift':f.conflict?'Conflicts with confirmed work':'Check availability and preferences'}</p><button class="button small" ${!f.eligible?'disabled':''} onclick="acceptWorker(${j.id})">Accept & open chat ${icon('check')}</button></div><div class="score">${f.score}%<small>demo fit</small></div></div>`}).join(''):empty('Your next teammate is out there.','Switch to the worker view and express interest in a shift to try matching.',`<button class="button light" onclick="setRole('worker')">Try worker view</button>`)}${accepted.length?`<h3 style="margin-top:28px">Your matches</h3>${accepted.map(a=>`<div class="request-row"><div><h3>${esc(state.profile.name)} · ${esc(job(a.jobId).title)}</h3><p>${statusText[a.status]}</p></div><button class="button light small" onclick="chat(${a.jobId})">Open chat</button></div>`).join('')}`:''}${shortlist()}</div><div><div class="panel availability"><span class="eyebrow">MATCHING YOU CAN EXPLAIN</span><h3>Relevant signals. Clear reasons.</h3><p class="panel-note">The demo score uses skills (45%), availability (25%), commute (20%), and pay preference (10%).</p><p class="panel-note">Availability, commute, pay, and conflicting confirmed shifts also act as eligibility filters. Scores help review a candidate; the employer makes the decision.</p></div></div></div>`}
function acceptWorker(id){const a=application(id);if(!a||a.status!=='applied'||!fit(job(id)).eligible)return toast('This request cannot be accepted right now.');a.status='matched';a.matchedAt=Date.now();a.messages=[{role:'system',text:'You’re matched! Confirm the shift details together, then review the demo agreement.'}];persist();render();chat(id)}
function openModal(body){modal.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:5px"><button class="close" aria-label="Close dialog" onclick="modal.close()">${icon('close')}</button></div>${body}`;if(!modal.open)modal.showModal()}
function chat(id){const a=application(id),j=job(id);openModal(`<div class="modal-head"><div><span class="eyebrow">${state.role==='worker'?esc(j.company):esc(state.profile.name)}</span><h2>${esc(j.title)}</h2></div><span class="badge green">${statusText[a.status]}</span></div><div class="steps"><span class="done">1. Matched</span><span class="${['contract','signed','completed'].includes(a.status)?'done':''}">2. Agreement</span><span class="${['signed','completed'].includes(a.status)?'done':''}">3. Confirmed</span></div><div class="messages" id="messages">${a.messages.map(m=>`<div class="bubble ${m.role===state.role?'self':''}"><small>${m.role==='system'?'JOBEX':m.role==='worker'?esc(state.profile.name):esc(j.company)}</small>${esc(m.text)}</div>`).join('')}</div><form class="message-form" onsubmit="sendMessage(event,${id})"><input name="message" required maxlength="600" placeholder="Write a message…" aria-label="Message"><button class="button" aria-label="Send message">${icon('arrow')}</button></form><p class="panel-note">You’re acting as the ${state.role}. Switch roles to reply from the other side.</p><div style="margin-top:18px">${a.status==='matched'?state.role==='employer'?`<button class="button full" onclick="contractPreview(${id})">${icon('spark')} Prepare demo contract</button>`:`<button class="button light full" onclick="state.role='employer';state.page='candidates';render();chat(${id})">Switch to employer to prepare agreement</button>`:['contract','signed'].includes(a.status)?`<button class="button full" onclick="contractPreview(${id})">${icon('briefcase')} ${a.status==='contract'?'Review demo contract':'View signed demo agreement'}</button>`:''}${a.status==='signed'?`<button class="button subtle full" style="margin-top:10px" onclick="completeDialog(${id})">Simulate completed shift ${icon('check')}</button>`:''}${a.status==='completed'?`<button class="button full" onclick="ratingDialog(${id})">${a[state.role+'Rating']?'View your feedback':'Leave '+(state.role==='worker'?'employer':'worker')+' feedback'} ${icon('heart')}</button>`:''}</div>`);const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}
function sendMessage(ev,id){ev.preventDefault();const msg=new FormData(ev.target).get('message').trim();if(!msg)return;application(id).messages.push({role:state.role,text:msg});persist();chat(id)}
function contractPreview(id){const a=application(id),j=job(id);const canSend=a.status==='matched'&&state.role==='employer',canSign=a.status==='contract'&&state.role==='worker';openModal(`<span class="eyebrow">${a.status==='signed'||a.status==='completed'?'DEMO AGREEMENT RECORD':'AI-ASSISTED CONTRACT PREVIEW'}</span><h2>Let’s make the details clear.</h2><div class="warning">Prototype only — a non-binding summary inspired by an umowa zlecenie workflow. It is not a complete legal contract. No legal signature or identity verification occurs.</div><div class="contract-box"><div class="contract-row"><span>Employer</span><b>${esc(j.company)}</b></div><div class="contract-row"><span>Worker</span><b>${esc(state.profile.name)}</b></div><div class="contract-row"><span>Assignment</span><b>${esc(j.title)}</b></div><div class="contract-row"><span>Location</span><b>${esc(j.area)}</b></div><div class="contract-row"><span>Shift</span><b>${day(j.date)}<br>${j.start}–${j.end} (${hours(j)} hours)</b></div><div class="contract-row"><span>Gross hourly rate</span><b>${j.rate} zł</b></div><div class="contract-row"><span>Estimated gross total</span><b>${earnings(j)} zł</b></div><div class="contract-row"><span>Employer confirmation</span><b>${a.status==='matched'?'Not sent':esc(j.company)+' · simulated'}</b></div><div class="contract-row"><span>Worker confirmation</span><b>${a.signedName?esc(a.signedName)+' · simulated':'Pending'}</b></div></div>${canSend?`<p class="panel-note">Review these details before sending. A production service would need complete, reviewed terms and a suitable signing process.</p><button class="button full" style="margin-top:18px" onclick="sendContract(${id})">Confirm & send demo agreement ${icon('arrow')}</button>`:canSign?`<form onsubmit="signContract(event,${id})"><label class="input-label" for="signature">Type your name to simulate signing</label><input name="signature" id="signature" required minlength="2" maxlength="60" placeholder="${esc(state.profile.name)}"><label class="check-row"><input name="consent" type="checkbox" required>I reviewed the shift details and understand this is a non-binding demo.</label><button class="button full">Simulate signing ${icon('check')}</button></form>`:a.status==='contract'?`<button class="button full" style="margin-top:18px" onclick="state.role='worker';state.page='matches';render();contractPreview(${id})">Switch to worker & review</button>`:''}<button class="text-button" style="margin-top:18px" onclick="chat(${id})">← Back to conversation</button>`)}
function sendContract(id){const a=application(id);if(state.role!=='employer'||a.status!=='matched')return;a.status='contract';a.messages.push({role:'system',text:'The employer confirmed and sent a demo agreement. The worker can now review and simulate signing.'});persist();render();contractPreview(id)}function signContract(ev,id){ev.preventDefault();const a=application(id);if(state.role!=='worker'||a.status!=='contract')return;const f=new FormData(ev.target);if(!f.get('consent'))return;if(!fit(job(id)).eligible)return toast('This shift conflicts with your current availability. Update your profile or resolve the conflict.');a.signedName=f.get('signature').trim();a.status='signed';a.signedAt=Date.now();a.messages.push({role:'system',text:'Both sides have confirmed the demo agreement. Your shift is now on the schedule.'});persist();render();chat(id);toast('Demo agreement signed. Your shift is confirmed.')}
function completeDialog(id){openModal(`<span class="eyebrow">DEMO TIME TRAVEL</span><h2>Jump to after the shift?</h2><p style="font-size:13px;color:var(--muted)">This marks the fictional shift as completed so you can try mutual feedback and see the metrics update. No real work or payment is recorded.</p><button class="button full" onclick="completeShift(${id})">Mark demo shift completed</button>`)}function completeShift(id){const a=application(id);if(a.status!=='signed')return;a.status='completed';a.messages.push({role:'system',text:'Demo shift completed. Both sides can now leave feedback.'});persist();render();ratingDialog(id)}let selectedRating=0;function ratingDialog(id){const a=application(id);selectedRating=a[state.role+'Rating']||0;openModal(`<span class="eyebrow">GOOD WORK DESERVES GOOD FEEDBACK</span><h2>How did the shift go?</h2><p class="panel-note">Rate your experience with ${state.role==='worker'?esc(job(id).company):esc(state.profile.name)}.</p><div class="rating-buttons" id="ratingButtons">${[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" class="${n<=selectedRating?'selected':''}" onclick="chooseRating(${n})">★</button>`).join('')}</div><button class="button full" id="ratingSubmit" ${selectedRating?'':'disabled'} onclick="saveRating(${id})">Save demo feedback</button><button class="text-button" style="margin-top:15px" onclick="state.role=state.role==='worker'?'employer':'worker';state.page=state.role==='worker'?'matches':'candidates';render();ratingDialog(${id})">Switch roles to leave the other review</button>`)}function chooseRating(n){selectedRating=n;document.querySelectorAll('#ratingButtons button').forEach((b,i)=>b.classList.toggle('selected',i<n));document.getElementById('ratingSubmit').disabled=false}function saveRating(id){if(!selectedRating)return;application(id)[state.role+'Rating']=selectedRating;persist();render();toast('Feedback saved. Switch roles to try the other review.');ratingDialog(id)}
function analytics(){const m=metrics();const ratings=state.applications.flatMap(a=>[a.workerRating,a.employerRating]).filter(Boolean);return heading('MEASURE WHAT ACTUALLY MATTERS','From a swipe to showing up.','These metrics reflect your demo actions, not real marketplace performance.')+statCards()+`<div class="profile-grid"><div class="panel"><h3>Your demo funnel</h3><div class="analytics-bars">${[['Interested',m.a.length],['Matched',m.matched.length],['Signed',m.signed.length],['Completed',m.completed.length]].map(([s,n])=>`<div><span>${s}</span><div class="progress"><span style="width:${m.a.length?n/m.a.length*100:0}%"></span></div><b>${n}</b></div>`).join('')}</div><p class="panel-note">Time to fill runs from the worker’s expression of interest to the simulated signature. Completion uses signed demo shifts as its denominator.</p></div><div class="panel"><span class="eyebrow">MUTUAL FEEDBACK</span><div style="font-size:44px;font-weight:750;margin:15px 0">${ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+' ★':'—'}</div><h3>${ratings.length} ${ratings.length===1?'rating':'ratings'} submitted</h3><p class="panel-note">Complete a signed shift in the conversation to leave worker and employer feedback. New sessions start without fabricated performance results.</p></div></div>`}
function resetDialog(){openModal(`<h2>Start the demo again?</h2><p class="panel-note">This clears your local demo shifts, messages, applications, and preferences, and restores the three example jobs.</p><button class="button full" style="margin-top:20px" onclick="state=seed();persist();modal.close();render();toast('Demo reset.')">Reset demo</button>`)}function wireSwipe(){const c=document.getElementById('swipeCard');if(!c)return;let start=null;c.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))start={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.5){const id=+c.dataset.job;dx>0?apply(id):skip(id)}});c.addEventListener('pointercancel',()=>start=null)}render();
</script></body></html>
